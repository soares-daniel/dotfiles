# ~/.config/tmux/tmux.conf
# Context-aware loader: sources common + context-specific config.
# Detects work vs personal via $HOME/softdev.
# Mirrors the zshrc/bashrc pattern.

# Common config (applies to both work and personal machines)
source-file ~/.config/tmux/tmux.conf.common

# Auto-detect context — set tmux environment so child processes inherit it.
# Default is personal; override to work if ~/softdev directory exists.
set-environment -g DOTFILES_CONTEXT personal
if-shell -b '[ -d "$HOME/softdev" ]' 'set-environment -g DOTFILES_CONTEXT work'

# Source context-specific config
if-shell -b '[ -d "$HOME/softdev" ]' 'source-file ~/.config/tmux/tmux.conf.work'
if-shell -b '[ ! -d "$HOME/softdev" ]' 'source-file ~/.config/tmux/tmux.conf.personal'
